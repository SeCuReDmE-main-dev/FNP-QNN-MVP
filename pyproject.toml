[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fnp-qnn-local-research-simulator"
version = "1.3.0a0"
description = "Local non-clinical research simulator for Cerebrum-style runtime events and QNN candidates."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24.0",
  "torch>=2.0.0",
  "scikit-learn>=1.3.0",
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "python-multipart>=0.0.6",
  "panel>=1.9.0",
]

[project.optional-dependencies]
qiskit = [
  "qiskit[visualization]>=2.0.0",
  "qiskit-machine-learning>=0.9.0",
  "qiskit-aer>=0.17.0",
  "qiskit-algorithms>=0.4.0",
  "qiskit-ibm-runtime>=0.47.0",
]
legacy-export = ["rethinkdb>=2.4.10"]
analysis = ["scipy>=1.10.0", "matplotlib>=3.6.0", "pandas>=2.0.0"]
observability = ["ddtrace>=2.8.0"]
dev = ["ruff>=0.5.0", "mypy>=1.8.0", "httpx>=0.24.0"]

[tool.setuptools]
packages = ["api", "core"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
